title: vLLM on Flexible MIG, slices created per pod and reclaimed after
environment: a100
description: >
  Two vLLM servers ask for 10000 and 20000 MiB with nvidia.com/vgpu-mode=mig. HAMi creates the smallest
  allowlisted profile that fits (2g.10gb and 3g.20gb on an A100-40GB) and removes it when the pod ends.
phases:
  - name: vLLM on MIG
    manifest: vllm-mig.yaml
    deployments: [vllm-mig-small, vllm-mig-large]
    selector: app=vllm-mig
    exec: [nvidia-smi -L]
    bench:
      config: ../bench/random-ramp.yaml
      targets:
        - {name: mig-2g.10gb, url: "http://vllm-mig-small:8000", model: Qwen/Qwen3-1.7B}
        - {name: mig-3g.20gb, url: "http://vllm-mig-large:8000", model: Qwen/Qwen3-4B}

# Steady random load for a single vLLM server: 512 in / 128 out tokens, ramping QPS.
load:
  type: poisson
  stages:
    - {rate: 1, duration: 30}
    - {rate: 2, duration: 30}
    - {rate: 4, duration: 30}
  request_timeout: 180.0
api: {type: completion, streaming: true}
server: {type: vllm, ignore_eos: true}
data:
  type: random
  input_distribution: {min: 512, max: 512, mean: 512, std_dev: 0}
  output_distribution: {min: 128, max: 128, mean: 128, std_dev: 0}
report:
  request_lifecycle: {summary: true, per_stage: true, per_request: false}

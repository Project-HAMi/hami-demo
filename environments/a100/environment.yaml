title: Kubernetes with NVIDIA A100s, HAMi Flexible MIG on one node, Lupine remote GPU server on another
# Hosts, control plane and the MIG_NODE / REMOTE_SERVER_NODE / CLIENT_NODE roles come from config.toml.
needs_config: true
conflicts:
  kube-system/volcano-device-plugin: volcano-vgpu-device-plugin
prepare:
  # Flexible MIG needs MIG mode on; a pending change may need a reboot of the node (see ../CAVEATS.md).
  # Keyed by the role in config.toml [environments.a100.nodes] whose host gets the command.
  MIG_NODE: "sudo nvidia-smi -mig 1 >/dev/null; nvidia-smi --query-gpu=index,mig.mode.current,mig.mode.pending --format=csv"

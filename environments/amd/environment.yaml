title: kind on the MI300X host, HAMi with amd-device-plugin 0.0.4
ssh_key: ~/.ssh/id_kubecon
control_plane: amd
hosts:
  amd: root@165.245.136.175
kind:
  name: hami-amd
  extraMounts:
    - {hostPath: /dev/kfd, containerPath: /dev/kfd}
    - {hostPath: /dev/dri, containerPath: /dev/dri}
  # Host default arp_ignore=2 breaks pod ARP to the gateway; see ../CAVEATS.md. Paths under /proc/sys, globs allowed.
  node_sysctls:
    net/ipv4/conf/default/arp_ignore: 0
    net/ipv4/conf/veth*/arp_ignore: 0
